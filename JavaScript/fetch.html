<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>

    <style>
        table {
            width: 80%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: cornflowerblue;
            border: 3px solid black;
        }
        td, th {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        img {
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>

    <script>
        const ele = document.getElementById("data");
        const URL = "https://dummyjson.com/products";

        async function loaddata() {
            try {
                const res = await fetch(URL);
                const data = await res.json();
                console.log("DATA", data.products);

                let row = "";
                data.products.forEach((i, index) => {
                    row += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.thumbnail}" width="60"></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                    </tr>
                    `;
                });
                ele.innerHTML = row;
            }
            catch (err) {
                console.log("ERROR", err);
            }
        }

        loaddata();
    </script>
</body>
</html>
